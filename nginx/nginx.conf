# ============================================================================
# wanle —— Nginx 生产配置（与服务器实际生效的配置保持一致）
#
# 位置：服务器上真实路径 /etc/nginx/conf.d/wanle.conf
#       仓库里的 nginx/nginx.conf 作为存档与重建参考。
#
# 部署方式：
#   cp nginx/nginx.conf /etc/nginx/conf.d/wanle.conf
#   nginx -t && systemctl reload nginx
#
# 结构说明：
#   - /etc/nginx/nginx.conf 保持发行版默认
#   - 站点配置独立成 conf.d/wanle.conf
#   - HTTPS 证书由 Certbot 管理，标注 "managed by Certbot" 的行改动后
#     执行 certbot renew 可能被覆盖
#
# 安全头为什么写在每个 location 里而不是 server 级：
#   nginx 的 add_header 只在「当前层级没有 add_header」时才继承上层。
#   一旦某个 location 写了 add_header（例如 Cache-Control），server 级的
#   全部安全头就整体失效。所以凡是会写 Cache-Control 的 location，
#   都必须自己带上这一组安全头，不能依赖继承。
# ============================================================================

server {
    server_name your-domain.com;

    # 前端静态文件（Vite 构建产物）
    root /usr/share/nginx/html;
    index index.html;

    # 上传体积上限：与后端 PayloadConfig 对齐
    client_max_body_size 64m;

    # ========================================================================
    # Gzip 压缩
    # ------------------------------------------------------------------------
    # JS 打包产物约 430KB，gzip 后约 148KB，是"页面卡"的主要原因之一。
    # ========================================================================
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        application/manifest+json
        image/svg+xml
        font/woff2
        font/woff
        font/ttf;

    # ---------- API 反向代理到 Rust (actix-web) 后端 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SVG 可内联执行脚本；上传目录允许 .svg，故对图床资源限制脚本来源
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # ---------- 静态文件（图床上传的图片/视频）由后端提供 ----------
    # 文件名由服务端生成「时间戳-随机串.扩展名」，内容落盘后不再变，
    # 属不可变资源，可长缓存。这里只用 expires，不手写 Cache-Control
    # （两者同时出现时 add_header 会覆盖 expires，反而丢掉 max-age）。
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # ---------- 缩略图（后端按需生成，永不变）----------
    # 由后端自己发 Cache-Control: max-age=86400，这里不重复设置。
    location /api/thumb/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # ---------- 前端构建产物：带内容哈希，可长期缓存 ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        try_files $uri =404;
    }

    # ---------- 字体：与 JS/CSS 同属不可变资源 ----------
    # 文件名不带哈希（子集脚本会覆盖同名文件），用较短缓存 + ETag 协商。
    location /fonts/ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        try_files $uri =404;
    }

    # ---------- 壁纸与表情（文件名固定，用较短缓存 + 可协商更新）----------
    location /anime/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        try_files $uri =404;
    }

    location /emojis/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        try_files $uri =404;
    }

    # ---------- SPA 路由回退 ----------
    # history 模式下直接访问 /blog/xxx 时磁盘上没有该文件，
    # 交给 index.html，由 Vue Router 在浏览器端接管。
    location / {
        # index.html 绝不能缓存，否则发版后用户仍是旧页面
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        try_files $uri $uri/ /index.html;
    }

    # ---------- TLS（Certbot 托管）----------
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ---------- HTTP 全部跳转 HTTPS ----------
server {
    if ($host = your-domain.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name your-domain.com;
    return 404; # managed by Certbot
}
